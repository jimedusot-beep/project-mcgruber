<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" role="img" aria-labelledby="title desc">
<title id="title">Project McGruber — exploded assembly concept for one low-voltage light-beam tripwire</title>
<desc id="desc">Exploded emitter on the left with battery pack, switch, current limiting resistor, diffused LED and tube; exploded receiver on the right with shading tube, light-dependent resistor, voltage divider resistor, wires and housing. Below are ESP32-C3 board powered by USB and smartphone alarm webpage. A dotted line indicates the light beam; wired sensor and Wi-Fi paths are shown separately. Educational concept, not a validated mechanical drawing or final pin-level schematic.</desc>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#697787"/></marker>
 <marker id="beamArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#e2a01d"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#1c2b3a}
 .head{font-weight:700;font-size:29px}
 .sub{font-size:15px;fill:#536576}
 .panel{fill:#fff;stroke:#d5e0ea;stroke-width:2}
 .section{font-size:20px;font-weight:700}
 .label{font-size:15px;font-weight:700}
 .note{font-size:13px;fill:#526375}
 .tiny{font-size:12px;fill:#617284}
 .guide{stroke:#9caebe;stroke-width:2;stroke-dasharray:6 6;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1240" height="930" fill="#f3f7fb"/>
<text x="35" y="48" class="head">PROJECT McGRUBER · LIGHT-BEAM TRIPWIRE</text>
<text x="36" y="75" class="sub">Exploded assembly concept · 1 beam · low-voltage components · proposed, not physically validated</text>
<rect x="30" y="100" width="570" height="365" rx="18" class="panel"/>
<rect x="640" y="100" width="570" height="365" rx="18" class="panel"/>
<rect x="30" y="100" width="570" height="52" rx="18" fill="#ffe8e6"/>
<rect x="30" y="126" width="570" height="26" fill="#ffe8e6"/>
<text x="52" y="133" class="section" fill="#a32e2e">1 · TRANSMITTER / EMITTER</text>
<text x="52" y="175" class="note">A separate battery-powered visible LED shines at the receiver.</text>
<!-- Emitter exploded elements -->
<g transform="translate(54 212)">
  <rect x="0" y="25" width="102" height="79" rx="16" fill="#cdd7df" stroke="#576e80" stroke-width="3"/>
  <path d="M8 39 H94 M8 90 H94" stroke="#8096a6" stroke-width="2"/>
