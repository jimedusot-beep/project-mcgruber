</g>
<text x="53" y="417" class="note">Alternative: use a complete low-brightness battery flashlight instead of building a bare LED circuit.</text>
<rect x="640" y="100" width="570" height="52" rx="18" fill="#e1f0fd"/>
<rect x="640" y="126" width="570" height="26" fill="#e1f0fd"/>
