  <rect x="128" y="40" width="80" height="48" rx="8" fill="#273948" stroke="#1d2d38" stroke-width="2"/>
  <rect x="139" y="47" width="25" height="34" rx="5" fill="#77b5e6"/><rect x="171" y="47" width="25" height="34" rx="5" fill="#77b5e6"/>
  <text x="168" y="132" class="label" text-anchor="middle">Batteries</text>
  <text x="168" y="149" class="tiny" text-anchor="middle">+ holder</text>
  <rect x="238" y="48" width="40" height="25" rx="5" fill="#434d56"/>
  <rect x="252" y="42" width="20" height="10" rx="3" fill="#da5a52"/>
  <text x="258" y="132" class="label" text-anchor="middle">Switch</text>
  <text x="258" y="149" class="tiny" text-anchor="middle">optional</text>
  <path d="M304 60 h10 l7 -8 7 16 7 -16 7 16 7 -16 7 8 h10" fill="none" stroke="#aa7937" stroke-width="5"/>
  <text x="337" y="132" class="label" text-anchor="middle">Resistor</text>
  <text x="337" y="149" class="tiny" text-anchor="middle">if bare LED</text>
  <path d="M387 61 h15" stroke="#5c6871" stroke-width="3"/><rect x="403" y="38" width="36" height="46" rx="16" fill="#ffb1a7" stroke="#d75c50" stroke-width="3"/><path d="M439 52 h10 M439 68 h10" stroke="#5c6871" stroke-width="3"/>
  <text x="419" y="132" class="label" text-anchor="middle">Diffused</text>
