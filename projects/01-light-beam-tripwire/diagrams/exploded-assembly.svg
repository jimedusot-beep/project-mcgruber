  <text x="171" y="172" class="tiny" text-anchor="middle">or phototransistor</text>
  <rect x="258" y="40" width="104" height="65" rx="9" fill="#a9d8bf" stroke="#558971" stroke-width="3"/>
  <g fill="#577969"><circle cx="274" cy="54" r="3"/><circle cx="293" cy="54" r="3"/><circle cx="312" cy="54" r="3"/><circle cx="333" cy="54" r="3"/><circle cx="348" cy="54" r="3"/></g>
  <path d="M275 77 h12 l6 -7 7 14 7 -14 7 14 7 -7 h15" fill="none" stroke="#a67834" stroke-width="5"/>
  <text x="309" y="154" class="label" text-anchor="middle">Divider resistor</text>
  <text x="309" y="172" class="tiny" text-anchor="middle">+ small board</text>
  <rect x="401" y="28" width="125" height="93" rx="14" fill="#cad6e1" stroke="#5f778b" stroke-width="3"/>
  <rect x="413" y="41" width="99" height="68" rx="7" fill="#e9eff4" stroke="#9aaaba"/>
  <path d="M526 52 q19 0 25 18 M526 67 q19 0 25 18 M526 82 q19 0 25 18" fill="none" stroke="#d56b5d" stroke-width="3"/>
