<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="t d">
<title id="t">Tripwire electrical signal flow, conceptual</title><desc id="d">Emitter battery drives a current-limited LED. Optical beam crosses to LDR divider powered by ESP32 3.3 volt rail. Signal goes to an ADC pin. ESP32 receives five volt USB power and serves a Wi-Fi phone webpage. No specific board pinout is claimed.</desc>
<style>text{font-family:Arial,sans-serif;fill:#243448}.h{font-size:27px;font-weight:bold}.s{font-size:17px}.sm{font-size:14px;fill:#546578}.box{stroke-width:2;rx:12}.wire{stroke:#607587;stroke-width:4;fill:none}.light{stroke:#d6a32b;stroke-width:5;stroke-dasharray:10 7;fill:none}.wifi{stroke:#8054b7;stroke-width:4;stroke-dasharray:5 7;fill:none}</style>
<rect width="1100" height="620" fill="#f5f8fb"/><text x="30" y="48" class="h">ONE-BEAM TRIPWIRE · ELECTRICAL CONCEPT</text><text x="30" y="77" class="sm">Concept only — actual pinout, resistances, current and sensor threshold require verification.</text>
<rect x="30" y="115" width="460" height="290" rx="15" fill="#fff4ed" stroke="#d5a180" class="box"/><text x="50" y="147" class="s" font-weight="bold">TRANSMITTER · electrically independent</text>
<rect x="54" y="192" width="113" height="74" rx="10" fill="#e3e9f0" stroke="#74869b" stroke-width="2"/><text x="110" y="221" class="s" text-anchor="middle">Battery</text><text x="110" y="244" class="sm" text-anchor="middle">rated supply</text>
<rect x="207" y="192" width="99" height="74" rx="10" fill="#e3e9f0" stroke="#74869b" stroke-width="2"/><text x="256" y="222" class="s" text-anchor="middle">Resistor</text><text x="256" y="245" class="sm" text-anchor="middle">calculated</text>
<rect x="350" y="192" width="111" height="74" rx="10" fill="#f8d7c8" stroke="#bd755d" stroke-width="2"/><text x="405" y="221" class="s" text-anchor="middle">Diffused</text><text x="405" y="245" class="s" text-anchor="middle">LED</text>
<path d="M167 228 H207 M306 228 H350" class="wire"/><text x="55" y="313" class="sm">Complete flashlight alternative: use its original</text><text x="55" y="336" class="sm">battery, switch and built-in current limiting.</text><text x="55" y="373" class="sm">Never connect an unprotected bare LED to a battery.</text>
<rect x="610" y="115" width="460" height="290" rx="15" fill="#ecf6ff" stroke="#8fb7d9" class="box"/><text x="630" y="147" class="s" font-weight="bold">RECEIVER · LDR divider example</text>
<rect x="640" y="180" width="170" height="62" rx="10" fill="#dce7f3" stroke="#7896b4" stroke-width="2"/><text x="725" y="204" class="s" text-anchor="middle">LDR</text><text x="725" y="225" class="sm" text-anchor="middle">receives beam</text>
<rect x="640" y="285" width="170" height="62" rx="10" fill="#dce7f3" stroke="#7896b4" stroke-width="2"/><text x="725" y="309" class="s" text-anchor="middle">Fixed resistor</text><text x="725" y="330" class="sm" text-anchor="middle">value to test</text>
<path d="M725 163 V180 M725 242 V285 M725 347 V373" class="wire"/><text x="740" y="171" class="sm">3.3 V from ESP32</text><text x="740" y="378" class="sm">GND to ESP32</text>
<circle cx="725" cy="265" r="7" fill="#2374b7"/><path d="M732 265 H904" stroke="#2374b7" stroke-width="4"/><text x="826" y="253" class="sm">ADC signal</text>
<path d="M462 228 H636" class="light"/><text x="551" y="214" class="sm" text-anchor="middle">LIGHT</text><text x="630" y="395" class="sm">Sensor readings change with light and darkness.</text>
<rect x="30" y="447" width="240" height="104" rx="12" fill="#dce7f3" stroke="#8099b4" stroke-width="2"/><text x="150" y="485" class="s" text-anchor="middle">5 V USB power</text><text x="150" y="512" class="sm" text-anchor="middle">power bank / adapter</text>
<rect x="344" y="447" width="324" height="104" rx="12" fill="#e0f2e8" stroke="#81b698" stroke-width="2"/><text x="506" y="485" class="s" text-anchor="middle">ESP32-C3 controller</text><text x="506" y="512" class="sm" text-anchor="middle">ADC + threshold + Wi-Fi firmware</text>
<rect x="758" y="447" width="312" height="104" rx="12" fill="#ede3f8" stroke="#ad8ccc" stroke-width="2"/><text x="914" y="485" class="s" text-anchor="middle">Phone browser</text><text x="914" y="512" class="sm" text-anchor="middle">Beam OK / Beam broken</text>
<path d="M270 499 H344" class="wire"/><path d="M668 499 H758" class="wifi"/>
<path d="M990 405 V430 H506 V447" stroke="#2374b7" stroke-width="3" fill="none"/><text x="777" y="424" class="sm">sensor input + 3.3 V + GND (conceptual)</text>
<text x="30" y="589" class="sm">LDR example only. Phototransistors and solar panels require their own verified interface designs.</text>
</svg>