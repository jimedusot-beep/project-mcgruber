<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" width="900" height="355" role="img" aria-labelledby="title desc">
<title id="title">McGruber silent control-box example: battery, switch, resistor and LED in series</title>
<desc id="desc">Illustrates wiring from verified 9V positive to identified mechanical switch terminals, to a 1 kilo-ohm current-limiting resistor, to LED anode then cathode returning to 9V negative. Parts must be measured before use.</desc>
<rect width="900" height="355" fill="#f8fbff"/><rect x="13" y="13" width="874" height="329" rx="17" stroke="#59799e" fill="none"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#173454"><text x="28" y="45" font-size="26" font-weight="bold">SILENT CONTROL BOX • BASIC SERIES CIRCUIT</text><text x="28" y="72" font-size="17">Power OFF while connecting • Diagram does not establish physical pinout or switch ratings.</text></g>
<rect x="29" y="106" width="148" height="151" rx="12" fill="#e3edf8" stroke="#1e405f" stroke-width="3"/><text x="103" y="145" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="26" fill="#152f4a">9V</text><text x="103" y="172" text-anchor="middle" font-family="Arial" font-size="15" fill="#152f4a">alkaline + snap</text><text x="103" y="203" text-anchor="middle" font-family="Arial" font-size="15" fill="#152f4a">Measured</text><text x="103" y="226" text-anchor="middle" font-family="Arial" font-size="15" fill="#152f4a">polarity</text>
<path d="M104 106 V94 H231" stroke="#bd2346" fill="none" stroke-width="5"/><text x="113" y="97" fill="#bd2346" font-family="Arial" font-size="21">+</text>
