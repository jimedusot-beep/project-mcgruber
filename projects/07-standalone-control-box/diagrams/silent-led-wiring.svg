<path d="M304 94 H372" stroke="#bd2346" fill="none" stroke-width="5"/>
<rect x="372" y="73" width="139" height="42" rx="9" stroke="#967431" stroke-width="3" fill="#fff0c5"/><text x="441" y="99" font-family="Arial" font-size="23" fill="#352900" text-anchor="middle" font-weight="bold">1 kΩ</text>
<path d="M511 94 H575" stroke="#bd2346" fill="none" stroke-width="5"/>
<circle cx="626" cy="94" r="39" fill="#ffe0e5" stroke="#a7213b" stroke-width="3"/><text x="626" y="104" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="#7a182b">LED</text>
