<svg xmlns="http://www.w3.org/2000/svg" width="890" height="270" viewBox="0 0 890 270" role="img" aria-label="Standalone alarm: switches + active buzzer"><rect width="890" height="270" fill="#fff"/><text x="445" y="33" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a2b3c">Standalone alarm: switches + active buzzer</text><path d="M62.0 130 H202.8" stroke="#1a2b3c" stroke-width="3" fill="none"/><path d="M302.8 130 H393.5" stroke="#1a2b3c" stroke-width="3" fill="none"/><path d="M493.5 130 H584.3" stroke="#1a2b3c" stroke-width="3" fill="none"/><path d="M684.3 130 H825.0" stroke="#1a2b3c" stroke-width="3" fill="none"/><rect x="202.8" y="97" width="100" height="65" rx="7" fill="#eaf1fa" stroke="#37485b" stroke-width="2"/><text x="252.8" y="121" text-anchor="middle" fill="#1a2b3c" font-family="Arial" font-size="14" font-weight="bold">ARM SW</text><text x="252.8" y="143" text-anchor="middle" fill="#1a2b3c" font-family="Arial" font-size="11">rated switch</text><rect x="393.5" y="97" width="100" height="65" rx="7" fill="#eaf1fa" stroke="#37485b" stroke-width="2"/><text x="443.5" y="121" text-anchor="middle" fill="#1a2b3c" font-family="Arial" font-size="14" font-weight="bold">COM/NC</text><text x="443.5" y="143" text-anchor="middle" fill="#1a2b3c" font-family="Arial" font-size="11">verified pair</text><rect x="584.3" y="97" width="100" height="65" rx="7" fill="#eaf1fa" stroke="#37485b" stroke-width="2"/><text x="634.3" y="121" text-anchor="middle" fill="#1a2b3c" font-family="Arial" font-size="14" font-weight="bold">BUZZER</text><text x="634.3" y="143" text-anchor="middle" fill="#1a2b3c" font-family="Arial" font-size="11">active 5V</text><text x="25" y="135" font-size="13" font-family="Arial" fill="#1a2b3c">+5V</text><text x="830" y="134" font-size="13" font-family="Arial" fill="#1a2b3c">0V</text><text x="445" y="207" text-anchor="middle" font-size="14" font-family="Arial" fill="#9b2929">CONDITIONAL 5V EXAMPLE — NOT A TESTED BUILD</text><text