<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="t d">
<title id="t">C1 silent 5-volt IR breakbeam circuit for Adafruit 2167 or 2168 only</title>
<desc id="d">Left rated IR transmitter: red lead to 5 volts, black lead to ground. Across a wireless infrared optical beam, receiver has red to regulated 5 volts, black to ground and white or yellow to an OUT node. Pull-up resistor 10 kilo-ohms from receiver 5 volts to OUT. Warning LED and series 1 kilo-ohm resistor from 5 volts to OUT, LED cathode at OUT. When beam is broken, Adafruit OUT pulls low and warning LED illuminates. Do not apply to unverified other modules.</desc>
<rect width="1120" height="660" rx="19" fill="#f4f8ff"/>
<text x="40" y="54" font-family="sans-serif" font-size="27" fill="#152e50" font-weight="bold">Silent IR break-beam — Example C1</text>
<text x="40" y="86" font-family="sans-serif" font-size="16" fill="#45566c">For Adafruit 2167 or 2168 complete rated pair only · regulated 5 V · NO sound, phone or controller</text>
<rect x="33" y="115" width="363" height="410" rx="15" fill="#e6eefb" stroke="#618ac0" stroke-width="2"/>
<rect x="415" y="115" width="672" height="410" rx="15" fill="#e1f7f5" stroke="#4c9c95" stroke-width="2"/>
<text x="52" y="149" font-family="sans-serif" font-size="21" font-weight="bold" fill="#123f74">EMITTER · Adafruit two-wire unit</text>
<text x="438" y="149" font-family="sans-serif" font-size="21" font-weight="bold" fill="#12665f">RECEIVER · Adafruit three-wire unit</text>
<rect x="78" y="233" width="260" height="131" rx="13" fill="#fff" stroke="#7599bb" stroke-width="2"/>
<text x="108" y="269" font-family="sans-serif" font-size="19" fill="#123f74">IR transmitter module</text>
<text x="108" y="303" font-family="sans-serif" font-size="16" fill="#335774">RED lead → +5 V</text>
<text x="108" y="331" font-family="sans-serif" font-size="16" fill="#335774">BLACK lead → GND</text>
