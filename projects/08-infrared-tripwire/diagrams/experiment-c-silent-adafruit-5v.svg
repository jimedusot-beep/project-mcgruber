<path d="M208 364 V395" stroke="#365276" stroke-width="3"/><text x="220" y="398" font-family="sans-serif" font-size="16" fill="#23416b">GND</text>
<path d="M340 302 H433" stroke="#e6a83e" stroke-width="3" stroke-dasharray="9 9"/><path d="M424 295 L435 302 424 309" fill="none" stroke="#e6a83e" stroke-width="3"/>
<text x="350" y="285" font-family="sans-serif" font-size="12" fill="#8b5916">IR light</text>
