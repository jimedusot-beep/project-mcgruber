<text x="995" y="319" font-family="sans-serif" font-size="11" fill="#af3b43">Cathode down</text>
<rect x="48" y="552" width="1024" height="83" rx="10" fill="#fff" stroke="#abbcce"/>
<text x="63" y="578" font-family="sans-serif" font-size="18" fill="#17385d" font-weight="bold">Truth table (verified for Adafruit pair)</text>
<text x="63" y="607" font-family="sans-serif" font-size="16" fill="#245071">Beam present = OUT HIGH → red warning OFF   •   Beam blocked = OUT LOW → red warning ON</text>
<text x="63" y="626" font-family="sans-serif" font-size="12" fill="#566479">Illustrative circuit only: check real lead colors, polarity and rated supply before energizing. Unplugged sensor is not fail-safe.</text>
</svg>