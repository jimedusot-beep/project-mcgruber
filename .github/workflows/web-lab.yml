name: McGruber Lab checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcgruber-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --init --shm-size=1g
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Legacy documentation and geometry regressions
        working-directory: .
        run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Desktop Chromium and iPhone WebKit emulation
        timeout-minutes: 8
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mcgruber-lab-static-preview
          path: web/dist/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Diagnose GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! pages_info=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1); then
            echo "::error title=GitHub Pages is not enabled::Settings > Pages > Build and deployment > Source > GitHub Actions. Enable this once as repository owner; then rerun the workflow. App installation tokens cannot create the missing Pages site."
            echo "Pages API response: ${pages_info}"
            exit 1
          fi
          publishing_mode=$(printf '%s' "${pages_info}" | jq -r '.build_type')
          if [ "${publishing_mode}" != "workflow" ]; then
            echo "::error title=Pages source is incorrect::Set Settings > Pages > Source to GitHub Actions (current: ${publishing_mode})"
            exit 1
          fi
          echo "GitHub Pages already enabled with Actions workflow publishing."
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
